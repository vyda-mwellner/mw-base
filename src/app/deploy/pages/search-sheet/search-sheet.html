<form class="gm-form" data-enter="suchen" (submit)="search(); $event.preventDefault()">
  <label class="gm-row gm-field">
    <span class="gm-text">
      <span class="gm-label">Suche</span>
      <span class="gm-note">Ticket-Key, Text oder Hash</span>
    </span>
    <input
      class="gm-slot"
      type="text"
      autocomplete="off"
      aria-keyshortcuts="q"
      [value]="term()"
      (input)="term.set($any($event.target).value)"
    />
  </label>
  <button type="submit" class="gm-btn gm-btn-primary" [disabled]="busy()">Suchen</button>
</form>
<p class="gm-hint">
  Gesucht wird in den lokalen Checkouts aller App-Repos. Der Schreibtisch zeigt die Commits mit den Stages,
  die sie enthalten, und zu einem Ticket-Key jedes Repo mit seinem Stand.
</p>
