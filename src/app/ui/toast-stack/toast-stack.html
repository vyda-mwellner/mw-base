@for (row of rows(); track row.id) {
  <div
    class="ts-toast"
    [attr.data-tone]="row.tone"
    [class.ts-closing]="row.closing"
    (mouseenter)="toasts.hold(row.id)"
    (mouseleave)="toasts.release(row.id)"
    (click)="toasts.dismiss(row.id)"
  >
    <p class="ts-title">
      {{ row.title }}
      @if (row.tone === 'error') {
        <kbd class="ts-key">Esc</kbd>
      }
    </p>
    @if (row.text) {
      <p class="ts-text">{{ row.text }}</p>
    }
  </div>
}
